[codecrate]
output = "context_ttsplan.md"
keep_docstrings = true
dedupe = true
metadata = false
respect_gitignore = true
exclude = ["*/.venv/*", "context_ttsplan.*"]
gitignore_allow = ["ttsplan/_version.py"]
include = [
  "**/*.py",
  "**/*.toml",
  "**/*.md",
  "**/*.json",
  "**/*.txt",
  "**/*.csv",
  "**/*.tsv",
  "**/*.yaml",
  "**/*.yml",
  "**/*.ssmd",
  "LICENSE",
]
split_max_chars = 0
layout = "full"
profile = "portable-agent"
emit_standalone_unpacker = true
