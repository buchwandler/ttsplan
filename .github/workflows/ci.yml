name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m 'not reference'
      - run: ruff check .
      - run: mypy ttsplan
      - run: python -m build
      - run: python -c "import importlib.metadata as m; import ttsplan; assert m.version('ttsplan') == ttsplan.__version__"


  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html


  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          names = set(ZipFile(wheel).namelist())
          assert "ttsplan/py.typed" in names
          assert "ttsplan/ttsplan.schema.json" in names
          PY
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/ttsplan-smoke
          /tmp/ttsplan-smoke/bin/python -m pip install dist/*.whl
      - name: Run installed smoke checks
        run: |
          /tmp/ttsplan-smoke/bin/python -c "import importlib.metadata as m; import ttsplan; assert m.version('ttsplan') == ttsplan.__version__"
          /tmp/ttsplan-smoke/bin/ttsplan --version
          /tmp/ttsplan-smoke/bin/ttsplan compile "Doctor Smith bought 5 kg." --lang en-us --json > /tmp/ttsplan-smoke.json
          /tmp/ttsplan-smoke/bin/ttsplan validate /tmp/ttsplan-smoke.json
          /tmp/ttsplan-smoke/bin/ttsplan inspect /tmp/ttsplan-smoke.json --segment 0

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - name: Verify tag and artifact versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import os
          from pathlib import Path
          from packaging.version import Version
          import ttsplan
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          assert Version(tag_version) == Version(ttsplan.__version__)
          assert metadata.version("ttsplan") == ttsplan.__version__
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert wheels and sdists
          assert any(tag_version in wheel.name for wheel in wheels)
          PY
      - name: Verify sdist rebuild preserves version
        run: |
          rm -rf /tmp/ttsplan-sdist
          mkdir /tmp/ttsplan-sdist
          tar -xzf dist/*.tar.gz -C /tmp/ttsplan-sdist
          test -n "$(find /tmp/ttsplan-sdist -name pyproject.toml -print -quit)"
          python -m build --sdist --outdir /tmp/ttsplan-sdist-rebuilt /tmp/ttsplan-sdist/*
          test "$(ls dist/*.tar.gz | xargs -n1 basename | sed 's/\.tar\.gz$//')" = "$(ls /tmp/ttsplan-sdist-rebuilt/*.tar.gz | xargs -n1 basename | sed 's/\.tar\.gz$//')"
