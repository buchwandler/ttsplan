name: Run tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q ttsplan tests
      - name: Type-check package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m mypy ttsplan
      - name: Lint package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q -m "not reference"

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lower-bound dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema
          python -m pip install \
            "phrasplit==0.3.9" \
            "ssmd==0.8.7" \
            "spokenform==0.4.3" \
            "typing_extensions>=4.0"
          python -m pip install --no-deps -e .
      - name: Run lower-bound tests
        run: python -m pytest -q -m "not reference"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next((Path(os.environ["RUNNER_TEMP"]) / "wheels").glob("*.whl"))
          names = set(ZipFile(wheel).namelist())
          assert "ttsplan/py.typed" in names
          assert "ttsplan/ttsplan.schema.json" in names
          PY
      - name: Install wheel in clean environment
        run: |
          python -m venv "$RUNNER_TEMP/ttsplan-wheel-venv"
          "$RUNNER_TEMP/ttsplan-wheel-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/wheels/ttsplan-*.whl
      - name: Run installed smoke checks
        run: |
          "$RUNNER_TEMP/ttsplan-wheel-venv/bin/python" -c \
            "import importlib.metadata as m; import ttsplan; assert m.version('ttsplan') == ttsplan.__version__"
          "$RUNNER_TEMP/ttsplan-wheel-venv/bin/ttsplan" --version
          "$RUNNER_TEMP/ttsplan-wheel-venv/bin/ttsplan" compile \
            "Doctor Smith bought 5 kg." --lang en-us --json > "$RUNNER_TEMP/ttsplan.json"
          "$RUNNER_TEMP/ttsplan-wheel-venv/bin/ttsplan" validate "$RUNNER_TEMP/ttsplan.json"
          "$RUNNER_TEMP/ttsplan-wheel-venv/bin/ttsplan" inspect \
            "$RUNNER_TEMP/ttsplan.json" --segment 0
